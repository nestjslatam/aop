name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the packages
        run: npm run build:libs

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm test

      - name: End to end tests
        run: npm run test:e2e

      - name: Build the demo application
        run: npm run build

  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
          cache: npm

      - run: npm ci

      # Fails when a change touches a published package without declaring how
      # its version should move. Use `npx changeset add --empty` when the change
      # does not need a release.
      - name: Check that the change declares a version bump
        run: npx changeset status --since=origin/${{ github.base_ref }}
